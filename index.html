<!doctype html>
<html lang="en" data-theme="vision" data-scheme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />

    <!-- Apply the saved theme and appearance before CSS paints to prevent a
         visible flash. Mirrors applyTheme() in src/theme/theme.ts: Vision is
         the default theme and opens dark until the visitor picks a mode. -->
    <script>
      (function () {
      try {
        var root = document.documentElement
        var theme = localStorage.getItem('angaadi:theme')
        if (theme !== 'vision' && theme !== 'apple' && theme !== 'macos-27' && theme !== 'studio') theme = 'vision'
        root.setAttribute('data-theme', theme)
        var appearance = localStorage.getItem('angaadi:appearance')
        if (appearance !== 'light' && appearance !== 'dark' && appearance !== 'system') {
          appearance = theme === 'vision' ? 'dark' : 'light'
        }
        var dark = appearance === 'dark' ||
          (appearance === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) root.setAttribute('data-scheme', 'dark')
        else root.removeAttribute('data-scheme')
        root.style.colorScheme = dark ? 'dark' : 'light'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'vision' ? (dark ? '#0a0b26' : '#ebe8ff') : theme === 'studio' ? (dark ? '#141415' : '#f7f6f3') : theme === 'macos-27' ? (dark ? '#141a26' : '#e9f1fb') : (dark ? '#000000' : '#f5f5f7'))
      } catch (_) {}
      })()
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo/Angaadi.png" />

    <!-- Viewport and Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- IE Compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#0a0b26" />
    <meta name="msapplication-TileColor" content="#0a0b26" />

    <!-- Apple Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Angaadi" />

    <!-- Description for SEO -->
    <meta name="description" content="Angaadi - Your trusted online shopping destination in India. Shop electronics, fashion, and more with great deals." />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Angaadi - Shop Online in India</title>
  </head>
  <body>
    <!-- Skip to main content for accessibility -->
    <a href="#main" class="skip-to-main">Skip to main content</a>

    <!-- Main application root -->
    <div id="root"></div>

    <!-- Fallback for users without JavaScript -->
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: sans-serif;">
        <h1>JavaScript Required</h1>
        <p>This application requires JavaScript to be enabled. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
